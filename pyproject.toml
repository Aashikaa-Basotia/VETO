[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veto"
version = "0.1.0"
description = "VETO: Runtime security gateway and adversarial evaluation platform for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi",
    "mcp",
    "pytest",
    "python-dotenv>=1.0"
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "backend"
]
